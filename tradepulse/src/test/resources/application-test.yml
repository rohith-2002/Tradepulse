spring:
  datasource:
    url: jdbc:h2:mem:tradepulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=INTERVAL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
  data:
    redis:
      timeout: 100ms
tradepulse:
  recovery:
    enabled: false
  demo:
    enabled: false
  outbox:
    enabled: false
jwt:
  # Public test fixture, deliberately different from any runtime signing key.
  secret: dGVzdC1maXh0dXJlLXNpZ25pbmcta2V5LW5vdC1hLXNlY3JldA==
